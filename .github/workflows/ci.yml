name: ci

on:
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Public-tree denylist
        uses: braininavatgroup/agent-operating-policy/.github/actions/public-tree-check@b8c552c8c595504eb3090042422b0e617c4c726b
        with:
          denylist: ${{ vars.PUBLIC_TREE_DENYLIST }}
      - name: Tap this checkout
        run: |
          brew tap braininavatgroup/tap "$GITHUB_WORKSPACE"
          brew trust --cask braininavatgroup/tap/writ
      - name: Audit and style casks
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
        run: |
          brew audit --cask --strict --online braininavatgroup/tap/writ
          brew style --cask braininavatgroup/tap/writ
      - name: Verify release download checksum
        run: brew fetch --cask --force braininavatgroup/tap/writ
