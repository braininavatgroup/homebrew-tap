name: ci

on:
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Public-tree denylist
        uses: braininavatgroup/homebrew-tap/.github/actions/public-tree-check@11cddd6240432acce2687d025d4dcc3365488902
        with:
          denylist: ${{ vars.PUBLIC_TREE_DENYLIST }}
      - name: Tap this checkout
        run: |
          brew tap braininavatgroup/tap "$GITHUB_WORKSPACE"
          brew trust --cask braininavatgroup/tap/writ
      - name: Audit and style casks
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
        run: |
          brew audit --cask --strict --online braininavatgroup/tap/writ
          brew style --cask braininavatgroup/tap/writ
      - name: Verify release download checksum
        run: brew fetch --cask --force braininavatgroup/tap/writ
    timeout-minutes: 30
    concurrency:
      group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}-ci
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
